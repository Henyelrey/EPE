# Apache delante del panel de la demostración. exponer-red.ps1 rellena los valores @...@.
# No toca la configuración de Laragon: se arranca aparte con su propio archivo.
ServerRoot "@SERVER_ROOT@"
ServerName @IP@:3191
Listen @IP@:3191
PidFile "@DEMO@/apache/httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30

# El registro guarda la IP real del cliente, que el proxy no puede ver detrás de Apache.
# El formato combinado no incluye la cabecera Authorization: los tokens no quedan escritos.
ErrorLog "@DEMO@/logs/apache-error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "@DEMO@/logs/apache-access.log" combined

# Solo proxy inverso hacia el panel. ProxyRequests activado convertiría a Apache en un proxy abierto.
ProxyRequests Off
ProxyTimeout 10

<Location "/">
    Require ip @SUBNET@
    ProxyPass "http://127.0.0.1:3191/"
    ProxyPassReverse "http://127.0.0.1:3191/"
</Location>
