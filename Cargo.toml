[package]
name = "rayo-cache"
version = "0.1.0"
edition = "2021"
description = "Proxy de caché HTTP/HTTPS local con intercepción TLS selectiva (Hudsucker + rustls + Hyper + Tokio)"
license = "MIT"

[dependencies]
hudsucker = { version = "0.25", features = ["rcgen-ca", "rustls-client", "decoder"] }
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
bytes = "1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "logging", "aws-lc-rs"] }
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tower-service = "0.3"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
